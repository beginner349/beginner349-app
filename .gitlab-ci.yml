stages:
  - build
  - test
  - package
  - push
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository" # Cache Maven dependencies

cache:
  paths:
    - .m2/repository/

build-job:
  stage: build
  image: maven:3.9.11-eclipse-temurin-21
  script:
    - echo "Building Java project with Maven..."
    - mvn compile

test-job:
  stage: test
  image: maven:3.9.11-eclipse-temurin-21
  script:
    - echo "Running tests..."
    - mvn test

package-job:
  stage: package
  image: maven:3.9.11-eclipse-temurin-21
  script:
    - echo "Packaging application..."
    - mvn package -DskipTests=true
  artifacts:
    paths:
      - target/*.jar

push-to-ecr:
  stage: push
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
  script:
    - aws --version
    - docker version
    - docker build -t $AWS_ECR/beginner349application .
    - aws ecr get-login-password | docker login --username AWS --password-stdin $AWS_ECR
    - docker push $AWS_ECR/beginner349application

# just to learn how to create a customer docker image and push to gitlab Container registry
.build_custom_docker_image:
  stage: .pre
  image: docker:28
  services:
    - docker:28-dind
  script:
    - docker version
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/java21-maven-awscli -f ci-cd/Dockerfile .
    - docker image ls
    - docker push $CI_REGISTRY_IMAGE/java21-maven-awscli

.test_image:
  stage: build
  image: $CI_REGISTRY_IMAGE/java21-maven-awscli
  script:
    - mvn --version
    - aws --version
