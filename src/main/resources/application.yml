spring:
  application:
    name: Beginner349-app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.beginner349.com/realms/myrealm

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://grafana-alloy.monitoring.svc.cluster.local:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://grafana-alloy.monitoring.svc.cluster.local:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://grafana-alloy.monitoring.svc.cluster.local:4318/v1/logs

# @ConfigurationPropertiesBinding example
custom-properties:
  exit-on-errors: true
  trade-start-date: 16-10-2021
