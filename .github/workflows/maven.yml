name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Test, and Package
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar

  push-to-ecr:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for AWS OIDC
      contents: read  # Required for checkout

    steps:
      - uses: actions/checkout@v6

      - name: Download JAR Artifact
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: target/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: beginner349-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  open-manifests-pr:
    needs: push-to-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s-manifests
        uses: actions/checkout@v6
        with:
          repository: beginner349/k8s-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}

      - name: Bump image tag in kustomization
        env:
          IMAGE: 542776678091.dkr.ecr.ap-southeast-1.amazonaws.com/beginner349-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd base
          kustomize edit set image spring-boot-app=$IMAGE:$IMAGE_TAG

      - name: Open PR to bump image tag
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          branch: bump/beginner349-app
          delete-branch: true
          commit-message: "chore: bump beginner349-app image to ${{ github.sha }}"
          title: "chore: bump beginner349-app image to ${{ github.sha }}"
          body: |
            Automated image bump from beginner349-app CI.

            - Commit: beginner349/beginner349-app@${{ github.sha }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

